# =====================================================
# Server Configuration
# =====================================================
server.port=8080

# =====================================================
# SQLite Database Configuration
# The database file "phishing.db" is created automatically
# inside the project root the first time the app runs.
# No separate database server is required.
# =====================================================
spring.datasource.url=jdbc:sqlite:phishing.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# =====================================================
# JPA / Hibernate Configuration
# =====================================================
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable Open-In-View warning noise
spring.jpa.open-in-view=false

# =====================================================
# Jackson (JSON) Configuration
# =====================================================
spring.jackson.serialization.indent-output=true

# =====================================================
# Application Info
# =====================================================
spring.application.name=phishing-email-detection
